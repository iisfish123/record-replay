name: Build APK

on:
  push:
    branches:
      - main
      - feat/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @record-replay/shared build

      - name: Build web assets
        working-directory: apps/app
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://ltw.frp.one:54802' }}
        run: pnpm build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Add Android platform
        working-directory: apps/app
        run: npx cap add android || npx cap sync android

      - name: Build Debug APK
        working-directory: apps/app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Find APK
        id: find-apk
        run: |
          APK_PATH=$(find apps/app/android -name "*.apk" -path "*debug*" | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK found: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: record-replay-apk
          path: ${{ steps.find-apk.outputs.apk_path }}
          retention-days: 30
