name: record-replay

services:
  mysql:
    image: mysql:8.4
    pull_policy: never
    container_name: record-replay-mysql
    environment:
      MYSQL_ROOT_PASSWORD: recordreplay
      MYSQL_DATABASE: record_replay
    ports:
      - "127.0.0.1:3316:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-precordreplay"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    pull_policy: never
    container_name: record-replay-redis
    ports:
      - "127.0.0.1:6389:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Kafka 4.0 KRaft 单节点：元数据由 controller quorum 管理，不需要 ZooKeeper。
  # 本机 9092 已被 li-dify-kafka 占用，故宿主机映射到 9093。
  # 双 listener：INTERNAL 给 compose 网络内的容器用，EXTERNAL 给宿主机上的 API/consumer 用。
  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    pull_policy: never
    container_name: record-replay-kafka
    ports:
      - "127.0.0.1:9093:9092"
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: "3"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "1"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - ./kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  # 一次性容器：显式建 topic（分区数/保留期可控），不依赖 auto.create.topics.enable。
  kafka-init:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    pull_policy: never
    container_name: record-replay-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T=/opt/bitnami/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rr.api.access --partitions 3 --replication-factor 1 \
          --config retention.ms=259200000
        $$T --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rr.api.error --partitions 3 --replication-factor 1 \
          --config retention.ms=2592000000
        $$T --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic rr.task.trace --partitions 3 --replication-factor 1 \
          --config retention.ms=2592000000
        $$T --bootstrap-server kafka:29092 --list

  clickhouse:
    image: bitnami/clickhouse:25.3.1
    pull_policy: never
    container_name: record-replay-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      ALLOW_EMPTY_PASSWORD: "yes"
      CLICKHOUSE_DATABASE: record_replay
    volumes:
      - ./clickhouse_data:/bitnami/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
